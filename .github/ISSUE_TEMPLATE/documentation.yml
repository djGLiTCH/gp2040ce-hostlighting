name: Documentation
description: Something in the documentation is wrong, unclear or missing
labels: [documentation]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The README
        - A folder's README
        - The Host Lighting specification (docs/host-lighting.md)
        - A command's help (--help)
        - Somewhere else
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or link
      placeholder: "README, The library: Testing a host"
  - type: textarea
    id: what
    attributes:
      label: What is wrong, unclear or missing
    validations:
      required: true
