[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gp2040ce-hostlighting"
description = "Tools for GP2040-CE's Host Lighting add-on: live RGB LED control from host software."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Jacob Simpson", email = "28767380+djGLiTCH@users.noreply.github.com"},
]
requires-python = ">=3.14"
dependencies = ["hidapi"]
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/djGLiTCH/gp2040ce-hostlighting"
"Bug Tracker" = "https://github.com/djGLiTCH/gp2040ce-hostlighting/issues"

[project.optional-dependencies]
dev = ["bandit", "flake8", "flake8-blind-except", "flake8-builtins", "flake8-docstrings", "flake8-executable",
       "flake8-fixme", "flake8-isort", "flake8-logging-format", "flake8-mutable", "flake8-pyproject", "mypy",
       "pytest", "pytest-cov", "reuse", "setuptools-scm"]

[project.scripts]
hlp-bench = "gp2040ce_hostlighting.tools.conformance:bench"
hlp-buttons = "gp2040ce_hostlighting.tools.commands:buttons"
hlp-caps = "gp2040ce_hostlighting.tools.commands:caps"
hlp-conformance = "gp2040ce_hostlighting.tools.conformance:conformance"
hlp-fill = "gp2040ce_hostlighting.tools.commands:fill"
hlp-input-mode = "gp2040ce_hostlighting.tools.commands:input_mode"
hlp-ping = "gp2040ce_hostlighting.tools.commands:ping"
hlp-reboot = "gp2040ce_hostlighting.tools.commands:reboot"
hlp-set-light = "gp2040ce_hostlighting.tools.commands:set_light"
hlp-settings = "gp2040ce_hostlighting.tools.commands:settings"
hlp-stream = "gp2040ce_hostlighting.tools.commands:stream"
hlp-watch = "gp2040ce_hostlighting.tools.commands:watch"

# Lint settings follow gp2040ce-binary-tools, where this code started.
[tool.flake8]
enable-extensions = "G,M"
exclude = [".tox/", "venv/", "build/"]
extend-ignore = "T101"
max-complexity = 10
max-line-length = 120

[tool.isort]
line_length = 120

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = 0
log_cli_level = "WARNING"

[tool.setuptools]
packages = ["gp2040ce_hostlighting", "gp2040ce_hostlighting.tools"]

[tool.setuptools.package-data]
gp2040ce_hostlighting = ["py.typed"]

[tool.setuptools_scm]
